services:
  - type: web
    name: documind-ai
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    disk:
      name: documind-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATA_DIR
        value: /var/data
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CHAT_MODEL
        value: gemini-3.1-flash-lite
      - key: EMBEDDING_MODEL
        value: models/gemini-embedding-001
      - key: MAX_UPLOAD_MB
        value: 15
      - key: LOG_LEVEL
        value: INFO
